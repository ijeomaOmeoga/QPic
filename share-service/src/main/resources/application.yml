server:
  port: 8086
  forward-headers-strategy: framework

spring:
  application:
    name: share-service
  datasource:
    url: jdbc:postgresql://localhost:5432/share_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  internal:
    secret: ${this-is-the-internal-secret-i-guess}
  share:
    base-url: ${SHARE_BASE_URL:https://share.example.com}
    deep-link-prefix: ${SHARE_DEEP_LINK_PREFIX:qpic://s/}
