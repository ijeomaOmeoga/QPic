server:
  port: 8085

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://localhost:5432/media_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  internal:
    secret: ${this-is-the-internal-secret-i-guess}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://10.35.170.242}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://10.35.170.242}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: qpic-media
    region: us-east-1
  media:
    max-image-bytes: 26214400      # 25 MB
    max-video-bytes: 262144000     # 250 MB
    view-url-ttl-minutes: 360
    upload-url-ttl-minutes: 30
