server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 600s      # large video uploads through the gateway
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
        - id: album-service
          uri: lb://album-service
          predicates:
            - Path=/api/albums/**
        - id: share-service
          uri: lb://share-service
          predicates:
            - Path=/api/shares/**,/api/public/shares/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234}
