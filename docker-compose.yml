name: qpic

x-service-env: &service-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET in .env}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0..3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000" # S3 API  (phones upload/download here via presigned URLs)
      - "9001:9001" # console

  discovery-server:
    build: { context: ., args: { MODULE: discovery-server } }
    ports:
      - "8761:8761"

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    environment: *service-env
    depends_on: [discovery-server]
    ports:
      - "8082:8082"
    restart: on-failure

  auth-service:
    build: { context: ., args: { MODULE: auth-service } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
    restart: on-failure

  media-service:
    build: { context: ., args: { MODULE: media-service } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/media_db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://10.35.170.242}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      discovery-server: { condition: service_started }
    restart: on-failure

  album-service:
    build: { context: ., args: { MODULE: album-service } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/album_db
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
    restart: on-failure

  share-service:
    build: { context: ., args: { MODULE: share-service } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/share_db
      SHARE_BASE_URL: ${SHARE_BASE_URL:-https://qpic.example.com}
      SHARE_DEEP_LINK_PREFIX: ${SHARE_DEEP_LINK_PREFIX:-qpic://s/}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
    restart: on-failure

volumes:
  pgdata:
  miniodata:
