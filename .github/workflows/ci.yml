# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: qpic-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn -B clean test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qpic:${{ github.sha }} .

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          mapfile -t manifests < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
            ! -path './.git/*' -print0 | xargs -0 -r grep -lE '^[[:space:]]*apiVersion:' || true)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests found; skipping validation."
            exit 0
          fi
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          "$(go env GOPATH)/bin/kubeconform" -strict -summary "${manifests[@]}"

  deploy-to-render:
    name: Deploy to Render
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-and-test, docker-build, validate-k8s]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "Render secrets are not configured; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
